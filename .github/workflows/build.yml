name: Compilar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar imágenes y fuentes si faltan
        run: bash tool/descargar_assets.sh

      - name: Crear carpetas de Android, iOS y web si faltan
        run: |
          if [ ! -d android ] || [ ! -d ios ] || [ ! -d web ]; then
            flutter create --org com.almabuena --project-name alma_buena --platforms=android,ios,web .
            rm -f test/widget_test.dart
          fi

      - name: Guardar en el repositorio lo que se generó (imágenes, fuentes, Android, iOS, web)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets android ios web .metadata
          if git diff --cached --quiet; then
            echo "Nada nuevo para guardar"
          else
            git commit -m "Agregar imágenes, fuentes y carpetas de Android, iOS y web"
            git push
          fi

      - run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar versión web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
