name: App de Android (APK)

# Cada cambio en main compila la app de Android y la publica en
# "Releases" -> "Alma Buena — última versión" -> alma-buena.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar imágenes y fuentes si faltan
        run: bash tool/descargar_assets.sh

      - run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preparar la firma de la app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/alma-buena.jks
            {
              echo "storeFile=alma-buena.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=almabuena"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > android/key.properties
            echo "Firma propia configurada"
          else
            echo "Sin secretos: se firma con la clave de depuración"
          fi

      - name: Compilar la app de Android
        run: flutter build apk --release

      - name: Renombrar el archivo
        run: cp build/app/outputs/flutter-apk/app-release.apk alma-buena.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Alma Buena — última versión
          body: |
            **App de Android de Alma Buena** (se actualiza sola con cada cambio).

            **Cómo instalarla:** desde el celular Android descargá `alma-buena.apk`,
            abrilo y tocá *Instalar*. Si Android pregunta, permití "instalar apps
            de origen desconocido" para el navegador.

            **iPhone:** abrí https://martinavalverde18-sketch.github.io/alma-buena-app/
            en Safari → botón Compartir → *Agregar a pantalla de inicio*.
          files: alma-buena.apk
          make_latest: true
          prerelease: false
